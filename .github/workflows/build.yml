name: Linux Port CI

on:
  push:
    branches: [ main, linux-port ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile and Package Linux App
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileJava :app:installDist

      - name: Upload Linux Build
        uses: actions/upload-artifact@v6
        with:
          name: aegires-linux
          path: app/build/install/app/
